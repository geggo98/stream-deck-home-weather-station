# Development-time credentials for talking to the real Netatmo API (npm run probe,
# npm run capture:fixture). The shipped plugin does NOT read this file: end users
# enter their own credentials in the Property Inspector.
#
# You need your own app at the Netatmo developer portal (scope: read_station).
# A secretspec provider must be selected first, otherwise `set` fails with
# "No provider backend configured". Tested (secretspec 0.21, scratch home): the dotenv
# provider, a plain file that .gitignore excludes (not encrypted):
#
#   export SECRETSPEC_PROVIDER="dotenv://$PWD/.env.local"
#   secretspec set NETATMO_CLIENT_ID      # repeat for NETATMO_CLIENT_SECRET, NETATMO_REFRESH_TOKEN
#   secretspec run -- npm run probe
#
# 1Password is the author's intended provider, end to end UNVERIFIED (`op` was not
# installed; only the secretspec side was seen). The sequence is:
#
#   secretspec config global provider add onepassword 'onepassword://<vault>'
#   export SECRETSPEC_PROVIDER=onepassword
#   secretspec set NETATMO_CLIENT_ID      # and the other two
#   secretspec run -- npm run probe
#
# Adding the alias alone does not select a provider. Inside `devenv shell` the variables
# are not set automatically: always go through `secretspec run --`.
#
# Never commit values. Rotating refresh tokens: the probe script writes the
# rotated token back through `secretspec set`, because Netatmo invalidates the
# old one on every refresh.

[project]
name = "home-weather-station"
revision = "1.0"

[profiles.default]
NETATMO_CLIENT_ID = { description = "Client ID of your own Netatmo developer app", required = true }
NETATMO_CLIENT_SECRET = { description = "Client secret of your own Netatmo developer app", required = true }
NETATMO_REFRESH_TOKEN = { description = "Refresh token with scope read_station (from the OAuth flow or the portal's token generator); rotates on every use", required = true }
