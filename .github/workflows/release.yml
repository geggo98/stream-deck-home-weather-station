name: Release

# release-please drives the whole release (see docs/PUBLISHING.md):
#   1. Every push to main opens/updates a "release" PR that maintains CHANGELOG.md
#      and bumps the version in package.json + package-lock.json from the
#      Conventional Commits. The Stream Deck manifest's 4-part Version is derived
#      from package.json at build time (scripts/sync-manifest-version.ts), not
#      bumped by release-please.
#   2. Merging that PR makes release-please create the vX.Y.Z tag + GitHub Release;
#      the build job then builds the .streamDeckPlugin file WITHOUT any write token
#      (npm install scripts and the build run there), and the separate upload job, which
#      has the write token but runs no checkout and no npm, attests and attaches it.
# Distribution is GitHub Releases only (docs/PUBLISHING.md explains why).
on:
  push:
    branches: [main]

# Default for every job; the jobs below raise only what they need.
permissions:
  contents: read

jobs:
  release-please:
    name: Maintain release PR / cut release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the GitHub Release
      pull-requests: write # open and update the release PR
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build .streamDeckPlugin (no write token)
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # Everything that executes third-party code (npm, the build) runs with a read-only
    # token and no credentials on disk, so a compromised dependency cannot touch the release.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the tagged release, not whatever main has moved on to since: release-please
          # tagged the merge commit, later pushes may already be on main.
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes

      - name: Set up Cachix (devenv binary cache, read-only)
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv

      - name: Install devenv (pinned)
        # The devenv CLI at the commit of release v2.4.0 (resolved with `git ls-remote`;
        # `nix eval` of its `devenv.version` prints 2.4.0), not a floating nixpkgs ref. The
        # tool versions the CLI then builds come from devenv.lock, which pins nixpkgs and
        # git-hooks. Update both together: bump this commit, then `devenv update`.
        run: nix profile add github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222#devenv

      - name: Build, validate, pack (through devenv)
        # --ignore-scripts: no dependency runs an install script. The only package with one is
        # the optional macOS file-watcher fsevents; build, validate and pack work without it.
        run: |
          devenv shell -- bash -ceuo pipefail '
            npm ci --ignore-scripts
            npm run typecheck
            npm run build
            npm test
            npm run validate
            npm run pack
          '

      - name: Hand the pack over to the upload job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: streamdeck-plugin
          path: "*.streamDeckPlugin"
          if-no-files-found: error
          retention-days: 1

  upload:
    name: Attest and attach .streamDeckPlugin (no checkout, no npm)
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the release asset
      id-token: write # sign the provenance attestation (OIDC)
      attestations: write # store the attestation
    steps:
      - name: Download the pack
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: streamdeck-plugin
          path: pack

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: pack/*.streamDeckPlugin

      - name: Attach .streamDeckPlugin to the release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" pack/*.streamDeckPlugin --clobber
